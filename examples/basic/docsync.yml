source: README.md

targets:
  - path: README.zh-CN.md
    language: zh-CN

rules:
  heading_structure: true
  section_hash: true
  links: true
  images: true
  terminology: true

terms:
  workspace:
    zh-CN: 工作区
  pull request:
    zh-CN: 拉取请求
  release:
    zh-CN: 发布

fail_on:
  missing_sections: false
  outdated_sections: false
  broken_links: false
  terminology_drift: false
  image_path_broken: false

report:
  format: markdown
